<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>甩尾巴｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">肢體語言</p><h1>甩尾巴</h1><p>尾巴像雨刷一樣掃動</p><h2>觀察描述</h2><p>尾巴左右掃動，有時伴隨耳朵往後壓。</p><h2>情境與可能原因</h2><p><strong>互動中尾巴明顯掃動，耳朵也變平</strong><br>牠可能覺得受威脅或不耐煩。</p><h2>注意事項</h2><p>暫停互動，觀察牠是否走開或放鬆。</p><h2>公開資料來源</h2><ul><li><a href="https://www.cats.org.uk/help-and-advice/cat-behaviour/cats-and-fighting">Cats Protection｜cats and fighting</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
