<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>半夜暴衝｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">活動遊戲</p><h1>半夜暴衝</h1><p>走廊突然變成跑道</p><figure class="behavior-image"><img src="../assets/midnight-zoomies.png" alt="橘貓在夜間走廊奔跑" width="1536" height="1024" loading="lazy"><figcaption>AI 生成行為示意圖</figcaption></figure><h2>觀察描述</h2><p>貓咪短時間快速跑動，有時急轉彎。</p><h2>情境與可能原因</h2><p><strong>家人準備睡覺時，貓咪在屋內來回跑</strong><br>可能是夜間活動的一部分。貓咪在清晨和黃昏通常也較活躍。</p><h2>注意事項</h2><p>保持跑動路線暢通，白天或傍晚安排互動遊戲。</p><h2>公開資料來源</h2><ul><li><a href="https://www.cats.org.uk/help-and-advice/caring-for-your-cat/home-and-environment/cats-at-night">Cats Protection｜cats at night</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
