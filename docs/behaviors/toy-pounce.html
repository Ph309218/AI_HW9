<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>撲抓玩具｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">活動遊戲</p><h1>撲抓玩具</h1><p>看準目標後，突然向前撲。</p><figure class="behavior-image"><img src="../assets/toy-pounce.png" alt="橘貓伸出前掌撲向布老鼠玩具" width="1536" height="1024" loading="lazy"><figcaption>AI 生成行為示意圖</figcaption></figure><h2>觀察描述</h2><p>貓咪盯著玩具，向前撲出並伸出前掌。</p><h2>情境與可能原因</h2><p><strong>玩具在地板上移動時</strong><br>追蹤和撲抓可出現在模仿狩獵的遊戲中。</p><h2>注意事項</h2><p>使用貓玩具引導撲抓，讓手指和腳趾遠離撲抓範圍。</p><h2>公開資料來源</h2><ul><li><a href="https://www.cats.org.uk/help-and-advice/cat-behaviour/cats-and-play">Cats Protection｜Cats and play</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
