<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舔毛理毛｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">日常習慣</p><h1>舔毛理毛</h1><p>用舌頭一下一下梳理自己的毛。</p><figure class="behavior-image"><img src="../assets/grooming.png" alt="橘貓轉頭用舌頭舔側腹的毛" width="1536" height="1024" loading="lazy"><figcaption>AI 生成行為示意圖</figcaption></figure><h2>觀察描述</h2><p>貓咪轉頭，伸出舌頭舔過側腹或其他搆得到的部位，接著收回舌頭再舔。</p><h2>情境與可能原因</h2><p><strong>貓咪坐在熟悉的地方，輪流舔拭身體不同部位</strong><br>舔毛是貓咪日常整理被毛的一部分。</p><h2>注意事項</h2><p>留意是否反覆舔同一處。若舔毛明顯增加，或出現掉毛、禿斑或皮膚破損，請諮詢獸醫。</p><h2>公開資料來源</h2><ul><li><a href="https://www.vet.cornell.edu/departments-centers-and-institutes/cornell-feline-health-center/health-information/feline-health-topics/cats-lick-too-much">Cornell University｜Cats that Lick Too Much</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
