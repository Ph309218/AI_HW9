<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蹭臉頰｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">肢體語言</p><h1>蹭臉頰</h1><p>用臉頰擦過桌腳或家具邊緣。</p><figure class="behavior-image"><img src="../assets/cheek-rubbing.png" alt="橘貓的臉頰貼著木椅邊緣" width="1536" height="1024" loading="lazy"><figcaption>AI 生成行為示意圖</figcaption></figure><h2>觀察描述</h2><p>貓咪側頭，讓臉頰貼住物體，再沿表面擦過。</p><h2>情境與可能原因</h2><p><strong>走過熟悉的家具時</strong><br>可能在物體表面留下臉頰的氣味。</p><h2>注意事項</h2><p>留意接觸的位置和動作，也給牠自行靠近與離開的空間。</p><h2>公開資料來源</h2><ul><li><a href="https://www.cats.org.uk/uploads/documents/cp-infographic-catbehaviour_why.pdf">Cats Protection｜Feline behaviour visual guide</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
