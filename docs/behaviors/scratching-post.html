<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抓貓抓柱｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">日常習慣</p><h1>抓貓抓柱</h1><p>前掌勾住柱面，身體往上伸展。</p><figure class="behavior-image"><img src="../assets/scratching-post.png" alt="橘貓後腳踩地，前掌伸向直立貓抓柱" width="1536" height="1024" loading="lazy"><figcaption>AI 生成行為示意圖</figcaption></figure><h2>觀察描述</h2><p>前腳伸向柱面，爪子勾住表面後往下拉。</p><h2>情境與可能原因</h2><p><strong>經過直立的貓抓柱時</strong><br>抓磨可留下氣味與抓痕，也能去除老舊的爪鞘。</p><h2>注意事項</h2><p>觀察牠偏好直立或水平的抓面。直立抓柱要穩固且夠高，讓牠伸展。</p><h2>公開資料來源</h2><ul><li><a href="https://www.vet.cornell.edu/departments-centers-and-institutes/cornell-feline-health-center/health-information/feline-health-topics/feline-behavior-problems-destructive-behavior">Cornell University｜Feline behavior problems: destructive behavior</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
