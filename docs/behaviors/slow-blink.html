<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>慢眨眼｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">肢體語言</p><h1>慢眨眼</h1><p>眼睛慢慢瞇起，再睜開。</p><figure class="behavior-image"><img src="../assets/slow-blink.png" alt="橘貓先瞇起雙眼再睜開" width="1536" height="1024" loading="lazy"><figcaption>AI 生成行為示意圖</figcaption></figure><h2>觀察描述</h2><p>雙眼逐漸瞇起，短暫閉合或接近閉合後再睜開。</p><h2>情境與可能原因</h2><p><strong>貓咪在熟悉的人附近休息</strong><br>慢眨眼可以是放鬆互動的一部分。</p><h2>注意事項</h2><p>看牠是否也維持放鬆的姿勢，並避免直盯牠的眼睛。</p><h2>公開資料來源</h2><ul><li><a href="https://www.cats.org.uk/help-and-advice/cat-behaviour/cat-body-language">Cats Protection｜Cat body language</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
