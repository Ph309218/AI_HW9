<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>踩奶｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">日常習慣</p><h1>踩奶</h1><p>在毯子上揉麵團</p><h2>觀察描述</h2><p>前腳輪流向下按壓。</p><h2>情境與可能原因</h2><p><strong>窩在柔軟的毯子上</strong><br>踩奶可能出現在放鬆時。幼貓吃奶時也有相似的動作。</p><h2>注意事項</h2><p>看看身體是否放鬆。若爪子讓你不舒服，可以墊一條毯子。</p><h2>公開資料來源</h2><ul><li><a href="https://www.cats.org.uk/cats-blog/why-do-cats-knead">Cats Protection｜why do cats knead</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
