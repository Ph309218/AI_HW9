<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飛機耳｜喵星人研究所</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><nav aria-label="主選單"><a href="../index.html">喵星人研究所</a><span><a href="../index.html#catalog">圖鑑</a><a href="../index.html#quiz">小測驗</a></span></nav></header><main><article class="detail"><a href="../index.html#catalog">← 返回行為圖鑑</a><p class="kicker">肢體語言</p><h1>飛機耳</h1><p>耳朵悄悄轉向兩側</p><h2>觀察描述</h2><p>雙耳轉向側邊或往後貼近頭部。</p><h2>情境與可能原因</h2><p><strong>陌生人靠近時，牠壓低耳朵並蹲低</strong><br>牠可能感到緊張。</p><h2>注意事項</h2><p>留意姿勢和退路。先停止接觸，讓牠有空間離開。</p><h2>公開資料來源</h2><ul><li><a href="https://www.cats.org.uk/help-and-advice/cat-behaviour/cat-body-language">Cats Protection｜cat body language</a></li></ul></article></main><footer><p>喵星人研究所 · 貓咪行為觀察筆記</p></footer></body></html>
